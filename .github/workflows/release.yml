name: Release

# Publie une Release à chaque tag v* (v1.0.0, v1.0.1…). Le tag doit
# correspondre à AppInfo.Version dans Sources/App/AppInfo.cs : l'application
# compare sa version compilée à celle de la Release pour proposer la mise à jour.
on:
  push:
    tags:
      - "v*"
  # Permet de relancer la construction sans créer un nouveau tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VLC_VERSION: "3.0.21"

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la cohérence de version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $info = Get-Content Sources/App/AppInfo.cs -Raw
          if ($info -notmatch 'Version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw "Version introuvable" }
          $app = $Matches[1]
          if ($app -ne $tag) { throw "Le tag v$tag ne correspond pas à AppInfo.Version $app" }
          Write-Host "Version $app confirmée"

      - name: Récupérer libVLC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archiveName = "vlc-$env:VLC_VERSION-win64.zip"
          $baseUrl = "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64"
          $zip = "vlc.zip"
          $checksumFile = "vlc.zip.sha256"
          $stage = "download"
          try {
            Write-Host "Downloading VLC archive from the official mirror..."
            Invoke-WebRequest -Uri "$baseUrl/$archiveName" -OutFile $zip -TimeoutSec 300
            Invoke-WebRequest -Uri "$baseUrl/$archiveName.sha256" -OutFile $checksumFile -TimeoutSec 60

            $stage = "checksum"
            $checksumText = Get-Content $checksumFile -Raw
            if ($checksumText -notmatch "(?i)\b([0-9a-f]{64})\b") { throw "The official SHA-256 file is invalid." }
            $expectedHash = $Matches[1].ToLowerInvariant()
            $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "VLC archive SHA-256 does not match the official checksum." }

            $stage = "extract"
            Expand-Archive -Path $zip -DestinationPath "vlc-dist" -Force
            $library = Get-ChildItem -Path "vlc-dist" -Filter "libvlc.dll" -File -Recurse | Select-Object -First 1
            if (-not $library) { throw "libvlc.dll was not found in the official VLC archive." }
            $root = $library.Directory.FullName
            foreach ($name in @("libvlccore.dll", "COPYING.txt", "AUTHORS.txt", "plugins")) {
              if (-not (Test-Path (Join-Path $root $name))) { throw "Required VLC payload is missing: $name" }
            }

            $stage = "copy"
            New-Item -ItemType Directory -Path "VLC" -Force | Out-Null
            foreach ($name in @("libvlc.dll", "libvlccore.dll", "COPYING.txt", "AUTHORS.txt")) {
              Copy-Item -LiteralPath (Join-Path $root $name) -Destination "VLC" -Force
            }
            $pluginDestination = "VLC\plugins"
            New-Item -ItemType Directory -Path $pluginDestination -Force | Out-Null
            Copy-Item -Path (Join-Path $root "plugins\*") -Destination $pluginDestination -Recurse -Force
            Remove-Item "VLC\plugins\gui" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "VLC\plugins\stream_out" -Recurse -Force -ErrorAction SilentlyContinue
            if (-not (Test-Path "VLC\libvlc.dll") -or -not (Test-Path "VLC\plugins")) { throw "The VLC payload copy is incomplete." }
            Get-ChildItem -Path "VLC" -Name
            Write-Host "VLC archive SHA-256 verified: $actualHash"
          } catch {
            Write-Error "VLC preparation failed during '$stage': $($_.Exception.Message)"
            throw
          }

      - name: Compiler l'application
        shell: cmd
        run: Sources\Reconstruire.bat

      - name: Construire l'installateur
        shell: cmd
        run: Installer\Construire-Installateur.bat

      - name: Empreintes SHA-256
        shell: pwsh
        run: |
          $info = Get-Content Sources/App/AppInfo.cs -Raw
          if ($info -notmatch 'Version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw "Version introuvable" }
          $setup = "setup-LyaranTV-$($Matches[1]).exe"
          foreach ($name in @($setup, "LyaranTV.exe")) {
            $file = "Dist/$name"
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File "$file.sha256" -Encoding ascii -NoNewline
            Write-Host "$file $hash"
          }

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "LyaranTV $tag" --notes-file Docs/RELEASE-NOTES.md
          }
          $files = @(Get-ChildItem Dist -File | ForEach-Object { $_.FullName })
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Echec de l'envoi des fichiers" }
