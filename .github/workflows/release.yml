name: Release

# Publie une Release à chaque tag v* (v1.0.0, v1.0.1…). Le tag doit
# correspondre à AppInfo.Version dans Sources/App/AppInfo.cs : l'application
# compare sa version compilée à celle de la Release pour proposer la mise à jour.
on:
  push:
    tags:
      - "v*"
  # Permet de relancer la construction sans créer un nouveau tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VLC_VERSION: "3.0.21"

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la cohérence de version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $info = Get-Content Sources/App/AppInfo.cs -Raw
          if ($info -notmatch 'Version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') { throw "Version introuvable" }
          $app = $Matches[1]
          if ($app -ne $tag) { throw "Le tag v$tag ne correspond pas à AppInfo.Version $app" }
          Write-Host "Version $app confirmée"

      - name: Récupérer libVLC
        shell: pwsh
        run: |
          $zip = "vlc.zip"
          $url = "https://get.videolan.org/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath vlc-dist
          $root = (Get-ChildItem vlc-dist -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Path VLC -Force | Out-Null
          Copy-Item "$root\libvlc.dll" "VLC\" -Force
          Copy-Item "$root\libvlccore.dll" "VLC\" -Force
          Copy-Item "$root\COPYING.txt" "VLC\" -Force
          Copy-Item "$root\AUTHORS.txt" "VLC\" -Force
          Copy-Item "$root\plugins" "VLC\plugins" -Recurse -Force
          Remove-Item "VLC\plugins\gui" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "VLC\plugins\stream_out" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem VLC | Select-Object Name

      - name: Compiler l'application
        shell: cmd
        run: Sources\Reconstruire.bat

      - name: Construire l'installateur
        shell: cmd
        run: Installer\Construire-Installateur.bat

      - name: Empreintes SHA-256
        shell: pwsh
        run: |
          foreach ($file in @("setup-LyaranTV.exe", "LyaranTV.exe")) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File "$file.sha256" -Encoding ascii -NoNewline
            Write-Host "$file $hash"
          }

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "LyaranTV $tag" --notes-file Docs/RELEASE-NOTES.md
          }
          gh release upload $tag setup-LyaranTV.exe setup-LyaranTV.exe.sha256 LyaranTV.exe LyaranTV.exe.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw "Echec de l'envoi des fichiers" }
